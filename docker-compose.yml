version: '3.8'

services:
  postgres_timescale:
    image: timescale/timescaledb:latest-pg17
    container_name: binance-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Том для данных – используем переменную DATA_PATH
      - ${DATA_PATH:-./pg_data}:/var/lib/postgresql/data
      # Монтируем папку со скриптами инициализации
      - ./init-db:/docker-entrypoint-initdb.d:ro
      # Монтируем конфигурацию бд
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 4G
    cpus: '2'
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  postgres_exporter: # Экспортер метрик (для мониторинга)
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_timescale:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${EXPORTER_PORT:-9187}:9187"
    depends_on:
      - postgres_timescale

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - postgres_exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  # btcusdt-collector:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: binance-collector:latest
  #   container_name: binance-collector-btcusdt
